<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Agent</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark-dimmed.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
/* ===== Reset & Variables ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg-primary: #09090b;
    --bg-secondary: #111113;
    --bg-tertiary: #1a1a1e;
    --border: #27272a;
    --border-light: #3f3f46;
    --text-primary: #fafafa;
    --text-secondary: #a1a1aa;
    --text-muted: #52525b;
    --accent: #10b981;
    --accent-light: #34d399;
    --accent-dim: #064e3b;
    --accent-glow: rgba(16, 185, 129, 0.12);
    --user-bg: #052e16;
    --user-border: rgba(16, 185, 129, 0.22);
    --agent-bg: #18181b;
    --agent-border: #27272a;
    --error-bg: rgba(127, 29, 29, 0.35);
    --error-border: rgba(239, 68, 68, 0.3);
    --error-text: #fca5a5;
    --radius: 12px;
    --radius-lg: 18px;
    --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
}

html, body {
    height: 100%;
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
}

body {
    background-image: radial-gradient(ellipse at 50% 0%, rgba(16,185,129,0.04) 0%, transparent 55%);
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== App Layout ===== */
#app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 900px;
    margin: 0 auto;
    position: relative;
}

/* ===== Header ===== */
#header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(9,9,11,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 10;
    flex-shrink: 0;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent-dim), #0d3d2e);
    border: 1px solid var(--user-border);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-light);
    flex-shrink: 0;
}

.header-left h1 {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
}

.status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 1px;
}

.status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: background 0.3s;
}
.status-connected {
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(16,185,129,0.45);
    animation: pulse-green 2s ease-in-out infinite;
}
.status-connecting, .status-reconnecting {
    background: #f59e0b;
    animation: pulse-yellow 1.2s ease-in-out infinite;
}
.status-disconnected { background: var(--text-muted); }
.status-error { background: #ef4444; }

@keyframes pulse-green {
    0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.45); }
    50% { box-shadow: 0 0 0 5px rgba(16,185,129,0); }
}
@keyframes pulse-yellow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
}

.header-right { display: flex; gap: 6px; }

.icon-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text-muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
}
.icon-btn:hover { color: var(--text-secondary); border-color: var(--border-light); background: var(--bg-tertiary); }
.icon-btn.confirming { color: #f59e0b; border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.08); }

/* ===== Chat Area ===== */
#chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 10px;
    scroll-behavior: smooth;
}

/* ===== Empty State ===== */
#empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 20px;
    animation: fadeIn 0.5s ease;
}
#empty-state.hidden { display: none; }

.empty-icon {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent-dim), #0a3525);
    border: 1px solid var(--user-border);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-light);
    margin-bottom: 20px;
}

#empty-state h2 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
}

#empty-state p {
    font-size: 0.88rem;
    color: var(--text-secondary);
    max-width: 380px;
    line-height: 1.6;
    margin-bottom: 6px;
}

.empty-sub {
    font-size: 0.75rem !important;
    color: var(--text-muted) !important;
    margin-bottom: 24px !important;
}

.suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 500px;
}

.suggestion-chip {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text-secondary);
    font-size: 0.8rem;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.4;
}
.suggestion-chip:hover {
    border-color: var(--user-border);
    color: var(--accent-light);
    background: rgba(16,185,129,0.06);
}

/* ===== Messages ===== */
.message {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
}
.message.message-visible { opacity: 1; transform: translateY(0); }

.message-user { justify-content: flex-end; }
.message-agent { justify-content: flex-start; }

.message-avatar {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    flex-shrink: 0;
    margin-top: 2px;
}

.message-bubble {
    max-width: 75%;
    min-width: 60px;
    padding: 10px 14px;
    border-radius: var(--radius-lg);
    position: relative;
    line-height: 1.6;
    font-size: 0.9rem;
}

.message-user .message-bubble {
    background: var(--user-bg);
    border: 1px solid var(--user-border);
    border-bottom-right-radius: 5px;
    color: #d1fae5;
}

.message-agent .message-bubble {
    background: var(--agent-bg);
    border: 1px solid var(--agent-border);
    border-bottom-left-radius: 5px;
    color: var(--text-primary);
}

.message-error .message-bubble {
    background: var(--error-bg);
    border-color: var(--error-border);
    color: var(--error-text);
}

/* ===== Message Meta ===== */
.message-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
    font-size: 0.7rem;
}

.message-sender {
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.message-time {
    color: var(--text-muted);
    opacity: 0.7;
}

.message-copy-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    opacity: 0;
    transition: all 0.2s;
}
.message:hover .message-copy-btn { opacity: 0.7; }
.message-copy-btn:hover { opacity: 1 !important; color: var(--text-secondary); background: rgba(255,255,255,0.05); }
.message-copy-btn.copied { color: var(--accent) !important; opacity: 1 !important; }
.message-copy-btn.copied .copy-icon { display: none; }
.message-copy-btn.copied .check-icon { display: block !important; }

/* ===== Message Content (Markdown) ===== */
.message-content { word-wrap: break-word; overflow-wrap: break-word; }
.message-content p { margin-bottom: 0.6em; }
.message-content p:last-child { margin-bottom: 0; }
.message-content h1, .message-content h2, .message-content h3 {
    margin-top: 0.9em; margin-bottom: 0.4em;
    font-weight: 700; color: var(--text-primary);
    letter-spacing: -0.02em;
}
.message-content h1 { font-size: 1.2em; }
.message-content h2 { font-size: 1.1em; }
.message-content h3 { font-size: 1.02em; }
.message-content ul, .message-content ol { margin-bottom: 0.6em; padding-left: 1.4em; }
.message-content li { margin-bottom: 0.2em; }
.message-content a { color: var(--accent-light); text-decoration: underline; text-underline-offset: 2px; }
.message-content strong { color: var(--text-primary); font-weight: 600; }
.message-content blockquote {
    border-left: 3px solid var(--accent-dim);
    padding-left: 0.9em; margin: 0.6em 0;
    color: var(--text-secondary); font-style: italic;
}
.message-content table { width: 100%; border-collapse: collapse; margin: 0.6em 0; font-size: 0.85em; }
.message-content th, .message-content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.message-content th { background: rgba(255,255,255,0.03); font-weight: 600; }
.message-content hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

.message-content code:not(pre code) {
    background: rgba(255,255,255,0.07);
    padding: 0.12em 0.4em;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.84em;
    color: var(--accent-light);
}

/* ===== Code Blocks ===== */
.code-block {
    margin: 0.7em 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0c0c0f;
}

.code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: rgba(255,255,255,0.025);
    border-bottom: 1px solid var(--border);
}

.code-lang {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
}

.code-copy-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    font-size: 0.7rem;
    font-family: var(--font-sans);
    padding: 2px 8px;
    border-radius: 4px;
    transition: all 0.2s;
}
.code-copy-btn:hover { color: var(--text-secondary); background: rgba(255,255,255,0.05); }
.code-copy-btn.copied { color: var(--accent); }

.code-block pre {
    margin: 0;
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 0.82em;
    line-height: 1.65;
}
.code-block code { font-family: var(--font-mono); }

/* ===== Typing Indicator ===== */
#typing-indicator {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    margin-bottom: 14px;
}
#typing-indicator.hidden { display: none; }

.typing-avatar {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    flex-shrink: 0;
}

.typing-bubble {
    background: var(--agent-bg);
    border: 1px solid var(--agent-border);
    border-radius: var(--radius-lg);
    border-bottom-left-radius: 5px;
    padding: 14px 18px;
    display: flex;
    gap: 5px;
    align-items: center;
}

.typing-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce-dot 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.16s; }
.typing-dot:nth-child(3) { animation-delay: 0.32s; }

@keyframes bounce-dot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
    30% { transform: translateY(-7px); opacity: 1; }
}

/* ===== Input Area ===== */
#input-area {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    background: rgba(9,9,11,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    flex-shrink: 0;
}

.input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 6px 6px 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.input-wrapper:focus-within {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px var(--accent-glow);
}

#user-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 0.9rem;
    line-height: 1.5;
    resize: none;
    max-height: 150px;
    padding: 6px 0;
}
#user-input::placeholder { color: var(--text-muted); }

#send-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
}
#send-btn:disabled {
    background: var(--bg-tertiary);
    color: var(--text-muted);
    cursor: not-allowed;
}
#send-btn:not(:disabled) {
    background: var(--accent);
    color: #022c22;
}
#send-btn:not(:disabled):hover {
    background: var(--accent-light);
    box-shadow: 0 0 18px rgba(16,185,129,0.25);
}
#send-btn:not(:disabled):active { transform: scale(0.93); }

.input-hint {
    text-align: center;
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 8px;
    opacity: 0.7;
}

/* ===== Toast ===== */
#toast-container {
    position: fixed;
    bottom: 110px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    pointer-events: none;
}

.toast {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 7px 18px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-family: var(--font-sans);
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.3s ease;
    white-space: nowrap;
}
.toast.toast-visible { opacity: 1; transform: translateY(0); }

/* ===== Animations ===== */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== Responsive ===== */
@media (max-width: 640px) {
    #header { padding: 12px 14px; }
    .header-left h1 { font-size: 0.92rem; }
    #chat-area { padding: 14px 10px 8px; }
    .message-bubble { max-width: 88%; }
    #input-area { padding: 10px 10px 12px; }
    .suggestions { flex-direction: column; align-items: stretch; }
    .suggestion-chip { text-align: center; }
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<div id="app">
    <!-- Header -->
    <header id="header">
        <div class="header-left">
            <div class="header-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/>
                    <path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>
                </svg>
            </div>
            <div>
                <h1>Signal Agent</h1>
                <div class="status">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">Connecting...</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="clear-btn" title="Clear chat" aria-label="Clear chat">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-area">
        <div id="empty-state">
            <div class="empty-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                    <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
                </svg>
            </div>
            <h2>Welcome to Signal Agent</h2>
            <p>Ask me anything. I can search the web and help you find answers.</p>
            <p class="empty-sub">Powered by Qwen3-4B with internet search</p>
            <div class="suggestions">
                <button class="suggestion-chip" data-prompt="Search for the latest AI news and summarize the key developments">Latest AI news</button>
                <button class="suggestion-chip" data-prompt="What is LangGraph and how does it work? Explain with examples">What is LangGraph?</button>
                <button class="suggestion-chip" data-prompt="Help me research recent breakthroughs in quantum computing">Quantum computing research</button>
            </div>
        </div>

        <div id="messages"></div>

        <div id="typing-indicator" class="hidden">
            <div class="typing-avatar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/>
                    <path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>
                </svg>
            </div>
            <div class="typing-bubble">
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer id="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="Type your message..." rows="1" aria-label="Message input"></textarea>
            <button id="send-btn" disabled title="Send message" aria-label="Send message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
                </svg>
            </button>
        </div>
        <div class="input-hint">Press Enter to send &middot; Shift+Enter for new line</div>
    </footer>
</div>

<div id="toast-container"></div>

<script>
(function() {
    /* ===== State ===== */
    const state = {
        ws: null,
        connected: false,
        messages: [],
        isGenerating: false,
        reconnectAttempts: 0,
        maxReconnect: 15,
        baseDelay: 800,
        clearConfirm: false,
        clearTimer: null
    };

    /* ===== DOM ===== */
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const messagesEl = $('#messages');
    const emptyState = $('#empty-state');
    const typingEl = $('#typing-indicator');
    const input = $('#user-input');
    const sendBtn = $('#send-btn');
    const clearBtn = $('#clear-btn');
    const statusDot = $('#status-dot');
    const statusText = $('#status-text');
    const toastBox = $('#toast-container');
    const chatArea = $('#chat-area');

    /* ===== WebSocket ===== */
    function connect() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        setStatus('connecting');
        try {
            state.ws = new WebSocket(`${proto}//${location.host}/ws`);
        } catch(e) {
            setStatus('error');
            scheduleReconnect();
            return;
        }

        state.ws.onopen = () => {
            state.connected = true;
            state.reconnectAttempts = 0;
            setStatus('connected');
        };

        state.ws.onmessage = e => {
            try { handleMsg(JSON.parse(e.data)); }
            catch(err) { console.error('Parse error:', err); }
        };

        state.ws.onclose = () => {
            state.connected = false;
            setStatus('disconnected');
            scheduleReconnect();
        };

        state.ws.onerror = () => setStatus('error');
    }

    function scheduleReconnect() {
        if (state.reconnectAttempts >= state.maxReconnect) {
            setStatus('error');
            return;
        }
        state.reconnectAttempts++;
        const delay = Math.min(state.baseDelay * Math.pow(1.4, state.reconnectAttempts - 1), 8000);
        setStatus('reconnecting');
        setTimeout(connect, delay);
    }

    function setStatus(s) {
        statusDot.className = 'status-dot';
        const map = {
            connecting: ['status-connecting', 'Connecting...'],
            connected: ['status-connected', 'Online'],
            disconnected: ['status-disconnected', 'Disconnected'],
            reconnecting: ['status-reconnecting', 'Reconnecting...'],
            error: ['status-error', 'Connection failed']
        };
        const [cls, txt] = map[s] || map.error;
        statusDot.classList.add(cls);
        statusText.textContent = txt;
    }

    /* ===== Message Handling ===== */
    function handleMsg(data) {
        if (data.type === 'status' && data.status === 'thinking') {
            showTyping();
        } else if (data.type === 'response') {
            hideTyping();
            addMsg('agent', data.content);
            state.isGenerating = false;
            refreshSend();
        } else if (data.type === 'error') {
            hideTyping();
            addMsg('agent', data.content, true);
            state.isGenerating = false;
            refreshSend();
        }
    }

    function send(content) {
        const text = (content || '').trim();
        if (!text || !state.connected || state.isGenerating) return;

        addMsg('user', text);
        input.value = '';
        autoResize();
        refreshSend();

        state.isGenerating = true;
        refreshSend();
        state.ws.send(JSON.stringify({ type: 'message', content: text }));
    }

    function addMsg(role, content, isError) {
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        state.messages.push({ id, role, content, time, isError: !!isError });
        emptyState.classList.add('hidden');

        const el = document.createElement('div');
        el.className = `message message-${role}${isError ? ' message-error' : ''}`;
        el.dataset.id = id;

        let avatar = '';
        if (role === 'agent') {
            avatar = `<div class="message-avatar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/>
                    <path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>
                </svg>
            </div>`;
        }

        const rendered = role === 'agent' ? renderMd(content) : escHtml(content).replace(/\n/g, '<br>');
        const sender = role === 'user' ? 'You' : 'Agent';

        el.innerHTML = `${avatar}
            <div class="message-bubble">
                <div class="message-meta">
                    <span class="message-sender">${sender}</span>
                    <span class="message-time">${time}</span>
                    <button class="message-copy-btn" onclick="window._copyMsg('${id}')" title="Copy message" aria-label="Copy message">
                        <svg class="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                        </svg>
                        <svg class="check-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                            <path d="M20 6 9 17l-5-5"/>
                        </svg>
                    </button>
                </div>
                <div class="message-content">${rendered}</div>
            </div>`;

        messagesEl.appendChild(el);
        requestAnimationFrame(() => el.classList.add('message-visible'));
        scrollBottom();
    }

    /* ===== Markdown ===== */
    function renderMd(text) {
        if (typeof marked === 'undefined') return escHtml(text).replace(/\n/g, '<br>');

        const renderer = {
            code({ text: code, lang }) {
                const language = lang || 'text';
                let hl;
                try {
                    hl = (typeof hljs !== 'undefined' && hljs.getLanguage(language))
                        ? hljs.highlight(code, { language }).value
                        : (typeof hljs !== 'undefined' ? hljs.highlightAuto(code).value : escHtml(code));
                } catch { hl = escHtml(code); }

                return `<div class="code-block">
                    <div class="code-header">
                        <span class="code-lang">${escHtml(language)}</span>
                        <button class="code-copy-btn" onclick="window._copyCode(this)">
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                            </svg> Copy
                        </button>
                    </div>
                    <pre><code class="hljs">${hl}</code></pre>
                </div>`;
            }
        };

        marked.use({ renderer, breaks: true, gfm: true });
        try { return marked.parse(text); }
        catch { return escHtml(text).replace(/\n/g, '<br>'); }
    }

    function escHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    /* ===== Copy ===== */
    window._copyMsg = function(id) {
        const msg = state.messages.find(m => m.id === id);
        if (!msg) return;
        navigator.clipboard.writeText(msg.content).then(() => {
            const btn = document.querySelector(`.message[data-id="${id}"] .message-copy-btn`);
            if (btn) {
                btn.classList.add('copied');
                setTimeout(() => btn.classList.remove('copied'), 2000);
            }
            toast('Copied to clipboard');
        }).catch(() => toast('Copy failed'));
    };

    window._copyCode = function(btn) {
        const block = btn.closest('.code-block');
        const code = block.querySelector('code').textContent;
        navigator.clipboard.writeText(code).then(() => {
            btn.classList.add('copied');
            btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Copied';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> Copy';
            }, 2000);
        }).catch(() => toast('Copy failed'));
    };

    /* ===== UI Helpers ===== */
    function showTyping() { typingEl.classList.remove('hidden'); scrollBottom(); }
    function hideTyping() { typingEl.classList.add('hidden'); }

    function scrollBottom() {
        requestAnimationFrame(() => {
            chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
        });
    }

    function autoResize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 150) + 'px';
    }

    function refreshSend() {
        sendBtn.disabled = !input.value.trim() || !state.connected || state.isGenerating;
    }

    function toast(msg) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        toastBox.appendChild(t);
        requestAnimationFrame(() => t.classList.add('toast-visible'));
        setTimeout(() => {
            t.classList.remove('toast-visible');
            setTimeout(() => t.remove(), 300);
        }, 1800);
    }

    function clearChat() {
        state.messages = [];
        messagesEl.innerHTML = '';
        emptyState.classList.remove('hidden');
    }

    /* ===== Events ===== */
    input.addEventListener('input', () => { autoResize(); refreshSend(); });

    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send(input.value);
        }
    });

    sendBtn.addEventListener('click', () => send(input.value));

    clearBtn.addEventListener('click', () => {
        if (!state.messages.length) return;

        if (state.clearConfirm) {
            clearChat();
            toast('Chat cleared');
            resetClearBtn();
        } else {
            state.clearConfirm = true;
            clearBtn.classList.add('confirming');
            clearBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/></svg>';
            state.clearTimer = setTimeout(resetClearBtn, 3000);
        }
    });

    function resetClearBtn() {
        state.clearConfirm = false;
        clearTimeout(state.clearTimer);
        clearBtn.classList.remove('confirming');
        clearBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>';
    }

    $$('.suggestion-chip').forEach(chip => {
        chip.addEventListener('click', () => send(chip.dataset.prompt));
    });

    /* ===== Init ===== */
    connect();
    input.focus();

})();
</script>
</body>
</html>
